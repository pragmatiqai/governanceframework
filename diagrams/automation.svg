<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1016" viewBox="0 0 1600 1016" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<title>Where automation saves the most</title><desc>The ten places where automation saves the most, placed on the lifecycle&#x27;s four phases, what stays with people, the guardrails on automation and the effort aimed for per path.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs>
<rect width="1600" height="1016" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#111827" text-anchor="start">Where automation saves the most</text>
<text x="40" y="80" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">The machine reads, pre-fills, settles by rule, routes, reminds and records. People decide, challenge, and test what a machine cannot.</text>
<rect x="40.0" y="112" width="369.5" height="58" rx="10" fill="#1D4ED8" />
<text x="56.0" y="136" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">PLAN AND DECIDE</text>
<text x="56.0" y="156" font-size="11.5" font-weight="400" fill="#E5E7EB" text-anchor="start">1 Discovered / planned · 2 Risk classification · Gate 1</text>
<rect x="40.0" y="182" width="369.5" height="344" rx="10" fill="#EFF6FF" />
<text x="56.0" y="206" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="1.2">AUTOMATED</text>
<rect x="52.0" y="218" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="74.0" cy="242" r="13" fill="#111827"/>
<text x="74.0" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="96.0" y="247" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Registration collected, not typed</text>
<text x="64.0" y="276" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">connectors, pipelines, AI pre-fill, a one-off import</text>
<rect x="52.0" y="320" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="74.0" cy="344" r="13" fill="#111827"/>
<text x="74.0" y="348.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="96.0" y="349" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Assessments that answer themselves</text>
<text x="64.0" y="378" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">pre-filled from the register; the class, materiality and</text>
<text x="64.0" y="392" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">path follow by rule</text>
<rect x="52.0" y="422" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="74.0" cy="446" r="13" fill="#111827"/>
<text x="74.0" y="450.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="96.0" y="451" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Assess once, reuse many times</text>
<text x="64.0" y="480" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">the platform&#x27;s assessment and the components&#x27; approvals</text>
<text x="64.0" y="494" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">are inherited</text>
<rect x="40.0" y="540" width="369.5" height="134" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4" />
<text x="56.0" y="564" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="1.2">PEOPLE DECIDE</text>
<circle cx="61.0" cy="585.5" r="2.6" fill="#1D4ED8"/>
<text x="72.0" y="590" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Confirm, and complete what could not be read</text>
<circle cx="61.0" cy="609.5" r="2.6" fill="#1D4ED8"/>
<text x="72.0" y="614" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">The owner confirms; governance reviews</text>
<circle cx="61.0" cy="633.5" r="2.6" fill="#1D4ED8"/>
<text x="72.0" y="638" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">The Gate 1 decision</text>
<rect x="423.5" y="112" width="369.5" height="58" rx="10" fill="#0F766E" />
<text x="439.5" y="136" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">BUILD AND PROVE</text>
<text x="439.5" y="156" font-size="11.5" font-weight="400" fill="#E5E7EB" text-anchor="start">3 Development / procurement · 4 Testing / review</text>
<rect x="423.5" y="182" width="369.5" height="344" rx="10" fill="#F0FDFA" />
<text x="439.5" y="206" font-size="11" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">AUTOMATED</text>
<rect x="435.5" y="218" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="457.5" cy="242" r="13" fill="#111827"/>
<text x="457.5" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="479.5" y="247" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Settled by rule, and recorded</text>
<text x="447.5" y="276" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">access requests whose policy needs no approval; the DPO</text>
<text x="447.5" y="290" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">not asked where no personal data</text>
<rect x="435.5" y="320" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="457.5" cy="344" r="13" fill="#111827"/>
<text x="457.5" y="348.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<text x="479.5" y="349" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Testing run by machines</text>
<text x="447.5" y="378" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">evaluation suites in the pipeline and on a schedule,</text>
<text x="447.5" y="392" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">outside the governance solution</text>
<rect x="423.5" y="540" width="369.5" height="134" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4" />
<text x="439.5" y="564" font-size="11" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="1.2">PEOPLE DECIDE</text>
<circle cx="444.5" cy="585.5" r="2.6" fill="#0F766E"/>
<text x="455.5" y="590" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Component owners decide the exceptions</text>
<circle cx="444.5" cy="609.5" r="2.6" fill="#0F766E"/>
<text x="455.5" y="614" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">The DPIA and the change risk assessment</text>
<circle cx="444.5" cy="633.5" r="2.6" fill="#0F766E"/>
<text x="455.5" y="638" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Red teaming, judging findings, the CISO&#x27;s challenge</text>
<rect x="807.0" y="112" width="369.5" height="58" rx="10" fill="#B45309" />
<text x="823.0" y="136" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">GO LIVE</text>
<text x="823.0" y="156" font-size="11.5" font-weight="400" fill="#E5E7EB" text-anchor="start">5 Approval decision · Gate 2 · 6 Under deployment</text>
<rect x="807.0" y="182" width="369.5" height="344" rx="10" fill="#FFFBEB" />
<text x="823.0" y="206" font-size="11" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1.2">AUTOMATED</text>
<rect x="819.0" y="218" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="841.0" cy="242" r="13" fill="#111827"/>
<text x="841.0" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="863.0" y="247" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Decisions prepared, not researched</text>
<text x="831.0" y="276" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">one page: the asset, its assessments, connections,</text>
<text x="831.0" y="290" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">history and what changed since</text>
<rect x="819.0" y="320" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="841.0" cy="344" r="13" fill="#111827"/>
<text x="841.0" y="348.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="863.0" y="349" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Settled by rule</text>
<text x="831.0" y="378" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">on the Light path Gate 1 and Gate 2 taken together</text>
<rect x="807.0" y="540" width="369.5" height="134" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4" />
<text x="823.0" y="564" font-size="11" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="1.2">PEOPLE DECIDE</text>
<circle cx="828.0" cy="585.5" r="2.6" fill="#B45309"/>
<text x="839.0" y="590" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">The Gate 2 decision: on the Light path in minutes</text>
<circle cx="828.0" cy="609.5" r="2.6" fill="#B45309"/>
<text x="839.0" y="614" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Confirming go-live</text>
<rect x="1190.5" y="112" width="369.5" height="58" rx="10" fill="#6D28D9" />
<text x="1206.5" y="136" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="1.2">RUN AND RETIRE</text>
<text x="1206.5" y="156" font-size="11.5" font-weight="400" fill="#E5E7EB" text-anchor="start">7 In production · 8 Escalated · 9 Retired</text>
<rect x="1190.5" y="182" width="369.5" height="344" rx="10" fill="#F5F3FF" />
<text x="1206.5" y="206" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="1.2">AUTOMATED</text>
<rect x="1202.5" y="218" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="1224.5" cy="242" r="13" fill="#111827"/>
<text x="1224.5" y="246.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="1246.5" y="247" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Change sorted before a person</text>
<text x="1214.5" y="276" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">rules sort changes into log only, tell the owner,</text>
<text x="1214.5" y="290" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">reassess, re-approve</text>
<rect x="1202.5" y="320" width="345.5" height="92" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
<circle cx="1224.5" cy="344" r="13" fill="#111827"/>
<text x="1224.5" y="348.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="1246.5" y="349" font-size="13" font-weight="700" fill="#111827" text-anchor="start">Controls and evidence watched</text>
<text x="1214.5" y="378" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">drift, controls off, evidence lapsing: tasks before it</text>
<text x="1214.5" y="392" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="start">is late; a pre-filled periodic review</text>
<rect x="1190.5" y="540" width="369.5" height="134" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.4" />
<text x="1206.5" y="564" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="1.2">PEOPLE DECIDE</text>
<circle cx="1211.5" cy="585.5" r="2.6" fill="#6D28D9"/>
<text x="1222.5" y="590" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Whether a change is a substantial modification</text>
<circle cx="1211.5" cy="609.5" r="2.6" fill="#6D28D9"/>
<text x="1222.5" y="614" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Acting on what is flagged</text>
<circle cx="1211.5" cy="633.5" r="2.6" fill="#6D28D9"/>
<text x="1222.5" y="638" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Suspension, return, retirement; accepting a risk</text>
<rect x="40" y="690" width="1520" height="64" rx="10" fill="#F3F4F6" />
<text x="56" y="716" font-size="11" font-weight="700" fill="#4B5563" text-anchor="start" letter-spacing="1.2">ACROSS THE WHOLE LIFECYCLE</text>
<circle cx="78" cy="736" r="13" fill="#111827"/>
<text x="78" y="740.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="100" y="741" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Work that routes itself: tasks by role, person or fact of the asset; reminders; escalation; leavers and movers from the directory</text>
<circle cx="1040" cy="736" r="13" fill="#111827"/>
<text x="1040" y="740.5" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="1062" y="741" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Evidence and reporting generated from the record</text>
<text x="1544" y="716" font-size="11.5" font-weight="400" fill="#4B5563" text-anchor="end" font-style="italic">the numbers rank the effort saved across the portfolio (11.1)</text>
<rect x="40" y="786" width="640" height="200" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2" />
<text x="58" y="816" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start" letter-spacing="1.2">GUARDRAILS ON AUTOMATION</text>
<circle cx="63" cy="839.5" r="2.6" fill="#4B5563"/>
<text x="74" y="844" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Automation proposes; it never grants. Declared or imported data never sets a class, an</text>
<text x="74" y="861" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">approval or a rule</text>
<circle cx="63" cy="880.5" r="2.6" fill="#4B5563"/>
<text x="74" y="885" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Every automatic outcome is recorded with the rule and version that produced it, and sampled</text>
<circle cx="63" cy="904.5" r="2.6" fill="#4B5563"/>
<text x="74" y="909" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Rules are configuration, published by a second person</text>
<circle cx="63" cy="928.5" r="2.6" fill="#4B5563"/>
<text x="74" y="933" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">AI that reads untrusted content cannot write</text>
<rect x="712" y="786" width="848" height="200" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
<text x="730" y="816" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start" letter-spacing="1.2">THE EFFORT AIMED FOR  ·  [TO CALIBRATE IN THE PILOT]</text>
<rect x="1033.0" y="830" width="164.66666666666666" height="26" rx="6" fill="#15803D" />
<text x="1115.3333333333333" y="848" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Light</text>
<rect x="1203.6666666666667" y="830" width="164.66666666666666" height="26" rx="6" fill="#B45309" />
<text x="1286.0" y="848" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Standard</text>
<rect x="1374.3333333333333" y="830" width="164.66666666666666" height="26" rx="6" fill="#B91C1C" />
<text x="1456.6666666666665" y="848" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enhanced</text>
<text x="730" y="878" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">The owner&#x27;s time to register and assess</text>
<text x="1115.3333333333333" y="878" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[&lt; 30 min]</text>
<text x="1286.0" y="878" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[&lt; 2 hours]</text>
<text x="1456.6666666666665" y="878" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">as it requires</text>
<line x1="730" y1="888" x2="1542" y2="888" stroke="#D1D5DB"/>
<text x="730" y="906" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">Registration to the Gate 1 decision</text>
<text x="1115.3333333333333" y="906" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[2 working days]</text>
<text x="1286.0" y="906" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[5 working days]</text>
<text x="1456.6666666666665" y="906" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[10 working days]</text>
<line x1="730" y1="916" x2="1542" y2="916" stroke="#D1D5DB"/>
<text x="730" y="934" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">Meetings</text>
<text x="1115.3333333333333" y="934" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">none</text>
<text x="1286.0" y="934" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">risk workshop, in writing</text>
<text x="1456.6666666666665" y="934" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">workshop; [Council]</text>
<line x1="730" y1="944" x2="1542" y2="944" stroke="#D1D5DB"/>
<text x="730" y="962" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">An approver&#x27;s time per decision</text>
<text x="1115.3333333333333" y="962" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[minutes]</text>
<text x="1286.0" y="962" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">[&lt; 1 hour]</text>
<text x="1456.6666666666665" y="962" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">—</text>
<line x1="730" y1="972" x2="1542" y2="972" stroke="#D1D5DB"/>
</svg>
