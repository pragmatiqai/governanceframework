<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="724" viewBox="0 0 1600 724" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" role="img">
<title>Safeguards and protections</title><desc>Four safeguards that no configuration can remove; three protections that are on by default and remain visible for as long as they are switched off; and the guardrails on automation.</desc><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap');</style>
<defs><linearGradient id="pq-title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#139782"/><stop offset="1" stop-color="#0090CE"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5957"/></marker><marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A86400"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BF3A2B"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2625"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8572"/></marker></defs>
<rect width="1600" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="25.2" font-weight="600" fill="url(#pq-title)" text-anchor="start">SAFEGUARDS AND PROTECTIONS</text>
<text x="40" y="80" font-size="13.5" font-weight="400" fill="#4E5957" text-anchor="start">Four safeguards that no configuration can remove, and three protections that are on by default and remain visible when switched off.</text>
<text x="40" y="116" font-size="11.7" font-weight="700" fill="#121918" text-anchor="start" letter-spacing="1.2">SAFEGUARDS: CANNOT BE SWITCHED OFF, BY ANYONE, ADMINISTRATORS INCLUDED</text>
<rect x="40.0" y="134" width="368.0" height="250" rx="19.2" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
<circle cx="84.0" cy="180" r="26" fill="#121918"/>
<path d="M 77.25 176.65 L 77.25 168.55 A 6.75 6.75 0 0 1 90.75 168.55 L 90.75 176.65" fill="none" stroke="#FFFFFF" stroke-width="2.9700000000000006"/>
<rect x="73.2" y="175.3" width="21.6" height="16.200000000000003" rx="3.375" fill="#FFFFFF" />
<circle cx="84.0" cy="182.725" r="2.16" fill="#FFFFFF"/>
<text x="62.0" y="236" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">History and the audit trail are</text>
<text x="62.0" y="257" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">immutable</text>
<text x="62.0" y="286" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">No decision, answer or change can be altered or</text>
<text x="62.0" y="304" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">deleted afterwards. The record can be shown as it</text>
<text x="62.0" y="322" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">stood on any past date.</text>
<rect x="62.0" y="340" width="190" height="26" rx="13" fill="#121918" />
<text x="157.0" y="357" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CANNOT BE SWITCHED OFF</text>
<rect x="424.0" y="134" width="368.0" height="250" rx="19.2" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
<circle cx="468.0" cy="180" r="26" fill="#121918"/>
<path d="M 461.25 176.65 L 461.25 168.55 A 6.75 6.75 0 0 1 474.75 168.55 L 474.75 176.65" fill="none" stroke="#FFFFFF" stroke-width="2.9700000000000006"/>
<rect x="457.2" y="175.3" width="21.6" height="16.200000000000003" rx="3.375" fill="#FFFFFF" />
<circle cx="468.0" cy="182.725" r="2.16" fill="#FFFFFF"/>
<text x="446.0" y="236" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">Declared data never sets outcomes</text>
<text x="446.0" y="265" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">A self-declaration, an imported manifest or a</text>
<text x="446.0" y="283" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">vendor&#x27;s document cannot set a classification,</text>
<text x="446.0" y="301" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">grant an approval or change a rule.</text>
<rect x="446.0" y="340" width="190" height="26" rx="13" fill="#121918" />
<text x="541.0" y="357" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CANNOT BE SWITCHED OFF</text>
<rect x="808.0" y="134" width="368.0" height="250" rx="19.2" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
<circle cx="852.0" cy="180" r="26" fill="#121918"/>
<path d="M 845.25 176.65 L 845.25 168.55 A 6.75 6.75 0 0 1 858.75 168.55 L 858.75 176.65" fill="none" stroke="#FFFFFF" stroke-width="2.9700000000000006"/>
<rect x="841.2" y="175.3" width="21.6" height="16.200000000000003" rx="3.375" fill="#FFFFFF" />
<circle cx="852.0" cy="182.725" r="2.16" fill="#FFFFFF"/>
<text x="830.0" y="236" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">AI that reads untrusted content</text>
<text x="830.0" y="257" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">cannot write</text>
<text x="830.0" y="286" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">An AI step that reads descriptions, documents or</text>
<text x="830.0" y="304" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">other external content has no power to change the</text>
<text x="830.0" y="322" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">register.</text>
<rect x="830.0" y="340" width="190" height="26" rx="13" fill="#121918" />
<text x="925.0" y="357" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CANNOT BE SWITCHED OFF</text>
<rect x="1192.0" y="134" width="368.0" height="250" rx="19.2" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
<circle cx="1236.0" cy="180" r="26" fill="#121918"/>
<path d="M 1229.25 176.65 L 1229.25 168.55 A 6.75 6.75 0 0 1 1242.75 168.55 L 1242.75 176.65" fill="none" stroke="#FFFFFF" stroke-width="2.9700000000000006"/>
<rect x="1225.2" y="175.3" width="21.6" height="16.200000000000003" rx="3.375" fill="#FFFFFF" />
<circle cx="1236.0" cy="182.725" r="2.16" fill="#FFFFFF"/>
<text x="1214.0" y="236" font-size="14.4" font-weight="700" fill="#121918" text-anchor="start">Administrator actions are audited</text>
<text x="1214.0" y="265" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">Every change to the configuration is recorded with</text>
<text x="1214.0" y="283" font-size="11.7" font-weight="400" fill="#4E5957" text-anchor="start">who made it and why.</text>
<rect x="1214.0" y="340" width="190" height="26" rx="13" fill="#121918" />
<text x="1309.0" y="357" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CANNOT BE SWITCHED OFF</text>
<text x="40" y="432" font-size="11.7" font-weight="700" fill="#121918" text-anchor="start" letter-spacing="1.2">PROTECTIONS: ON BY DEFAULT; SWITCHED OFF ONLY WITH A REASON, AND SHOWN WHILE OFF</text>
<rect x="40.0" y="450" width="496.0" height="150" rx="19.2" fill="#F3FCFA" stroke="#E5E5E5" stroke-width="1" />
<rect x="62.0" y="474" width="56" height="30" rx="15" fill="#0E8572" />
<circle cx="103.0" cy="489" r="11" fill="#FFFFFF"/>
<text x="80.0" y="494" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle">ON</text>
<text x="136.0" y="486" font-size="13.5" font-weight="700" fill="#121918" text-anchor="start">A person decides go-live</text>
<text x="136.0" y="506" font-size="11.25" font-weight="400" fill="#4E5957" text-anchor="start">The approval to go live is a human decision.</text>
<line x1="62.0" y1="526" x2="514.0" y2="526" stroke="#E5E5E5" stroke-width="1"/>
<text x="62.0" y="550" font-size="9.45" font-weight="700" fill="#4E5957" text-anchor="start" letter-spacing="1.1">IF SWITCHED OFF</text>
<text x="62.0" y="570" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">a reason recorded; shown for as long as it is off; stamped on every</text>
<text x="62.0" y="587" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">approval made meanwhile</text>
<rect x="552.0" y="450" width="496.0" height="150" rx="19.2" fill="#F3FCFA" stroke="#E5E5E5" stroke-width="1" />
<rect x="574.0" y="474" width="56" height="30" rx="15" fill="#0E8572" />
<circle cx="615.0" cy="489" r="11" fill="#FFFFFF"/>
<text x="592.0" y="494" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle">ON</text>
<text x="648.0" y="486" font-size="13.5" font-weight="700" fill="#121918" text-anchor="start">The approver is not the requester</text>
<text x="648.0" y="506" font-size="11.25" font-weight="400" fill="#4E5957" text-anchor="start">Nobody approves what they asked for.</text>
<line x1="574.0" y1="526" x2="1026.0" y2="526" stroke="#E5E5E5" stroke-width="1"/>
<text x="574.0" y="550" font-size="9.45" font-weight="700" fill="#4E5957" text-anchor="start" letter-spacing="1.1">IF SWITCHED OFF</text>
<text x="574.0" y="570" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">a reason recorded; shown for as long as it is off; stamped on every</text>
<text x="574.0" y="587" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">approval made meanwhile</text>
<rect x="1064.0" y="450" width="496.0" height="150" rx="19.2" fill="#F3FCFA" stroke="#E5E5E5" stroke-width="1" />
<rect x="1086.0" y="474" width="56" height="30" rx="15" fill="#0E8572" />
<circle cx="1127.0" cy="489" r="11" fill="#FFFFFF"/>
<text x="1104.0" y="494" font-size="9.45" font-weight="700" fill="#FFFFFF" text-anchor="middle">ON</text>
<text x="1160.0" y="486" font-size="13.5" font-weight="700" fill="#121918" text-anchor="start">A second person publishes changes</text>
<text x="1160.0" y="506" font-size="11.25" font-weight="400" fill="#4E5957" text-anchor="start">Changes to workflows and forms are published by a second person.</text>
<line x1="1086.0" y1="526" x2="1538.0" y2="526" stroke="#E5E5E5" stroke-width="1"/>
<text x="1086.0" y="550" font-size="9.45" font-weight="700" fill="#4E5957" text-anchor="start" letter-spacing="1.1">IF SWITCHED OFF</text>
<text x="1086.0" y="570" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">a reason recorded; shown for as long as it is off; every version</text>
<text x="1086.0" y="587" font-size="11.25" font-weight="400" fill="#121918" text-anchor="start">published meanwhile says “no second person”</text>
<rect x="40" y="630" width="1520" height="64" rx="19.2" fill="#121918" />
<text x="64" y="657" font-size="9.9" font-weight="700" fill="#9AA5A3" text-anchor="start" letter-spacing="1.2">GUARDRAILS ON AUTOMATION</text>
<text x="64" y="679" font-size="11.7" text-anchor="start" xml:space="preserve"><tspan fill="#FFFFFF" font-weight="700">Automation proposes and never grants</tspan><tspan fill="#E5E5E5" font-weight="400">  ·  every automatic outcome recorded with the rule and version that produced it, and sampled  ·  rules are configuration, published by a second person</tspan></text>
</svg>
